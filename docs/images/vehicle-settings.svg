<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="700" viewBox="0 0 1024 700" role="img" aria-labelledby="title desc"><title id="title">Package Manager settings</title><desc id="desc">Scrollable Settings dialog for package source, startup preference, registry address and optional device profile, with Hide keyboard, Cancel and Save.</desc><g font-family="Arial, Helvetica, sans-serif">
