<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="t d"><title id="t">Choose a package path</title><desc id="d">Registry packages can be downloaded directly by the vehicle. Alternatively use Companion to verify registry downloads or manually imported ZIPs, prepare USB, then confirm installation in the vehicle.</desc><rect width="720" height="490" rx="12" fill="#141a23"/><g font-family="system-ui,sans-serif" font-size="21" fill="#edf1f7"><text x="24" y="45">Two ways to prepare an installer</text><rect x="24" y="75" width="310" height="74" rx="8" fill="#202c3d"/><text x="44" y="119">Cloud Registry</text><rect x="386" y="75" width="310" height="74" rx="8" fill="#202c3d"/><text x="406" y="119">Registry or local ZIP</text><path d="M179 150v50m362-50v50" stroke="#92c5ff" stroke-width="4"/><rect x="24" y="200" width="310" height="110" rx="8" fill="#202c3d"/><text x="44" y="240">Vehicle downloads</text><text x="44" y="275">and verifies</text><rect x="386" y="200" width="310" height="110" rx="8" fill="#202c3d"/><text x="406" y="240">Companion verifies</text><text x="406" y="275">and prepares USB</text><path d="M179 310v45h182m180-45v45H361v30" fill="none" stroke="#92c5ff" stroke-width="4"/><rect x="105" y="385" width="510" height="74" rx="8" fill="#202c3d"/><text x="127" y="429">Review and confirm in the vehicle</text></g></svg>