<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="612" viewBox="0 0 1024 612" role="img" aria-labelledby="title desc">
  <title id="title">Package Manager: Help</title>
  <desc id="desc">Short sections describe each tab and its contextual actions.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="1024" height="612" fill="#14181e" />
    <text x="20" y="595" font-size="14" fill="#a5b2c5">Illustrative mockup - Example data - Not a vehicle screenshot</text>
    <rect x="100" y="20" width="824" height="530" rx="6" fill="#14181e" stroke="#5b748f" />
    <text x="124" y="58" font-size="25" fill="#ebeef4" font-weight="700">Help</text>
    <text x="124" y="100" font-size="18" fill="#a8d5ff" font-weight="700">Getting started</text>
    <text x="124" y="128" font-size="17" fill="#ebeef4" font-weight="400">Insert USB and Refresh. Select a tab, then a package.</text>
    <text x="124" y="175" font-size="18" fill="#a8d5ff" font-weight="700">Tabs</text>
    <text x="124" y="203" font-size="17" fill="#ebeef4" font-weight="400">Installed: Uninstall, Launch, Details</text>
    <text x="124" y="230" font-size="17" fill="#ebeef4" font-weight="400">Updates: Update; Available: Install; Scripts: Run script</text>
    <text x="124" y="282" font-size="18" fill="#a8d5ff" font-weight="700">Adding or updating packages</text>
    <text x="124" y="310" font-size="17" fill="#ebeef4" font-weight="400">Prepare releases in the USB companion on your computer.</text>
    <text x="124" y="337" font-size="17" fill="#ebeef4" font-weight="400">Return to the vehicle, Refresh, and confirm Install or Update.</text>
    <text x="124" y="389" font-size="18" fill="#a8d5ff" font-weight="700">Need more information?</text>
    <text x="124" y="417" font-size="17" fill="#ebeef4" font-weight="400">Details shows versions, files, and operation diagnostics.</text>
    <text x="124" y="444" font-size="17" fill="#ebeef4" font-weight="400">Keep USB plugged in during installs and updates.</text>
    <rect x="748" y="482" width="152" height="48" rx="6" fill="#196389" stroke="#5b748f" />
    <text x="824.0" y="512" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">OK</text>
  </g>
</svg>