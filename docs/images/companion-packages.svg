<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="700" viewBox="0 0 1024 700" role="img" aria-labelledby="title desc"><title id="title">USB companion</title><desc id="desc">Illustrative companion browser with Settings, drive selector and preparation steps.</desc><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1024" height="700" rx="6" fill="#14181e"/>
<text x="32" y="46" font-size="26" fill="#ebeef4" font-weight="700">USB companion</text>
