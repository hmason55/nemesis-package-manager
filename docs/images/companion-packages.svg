<text x="915.0" y="190" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Refresh</text>
<text x="32" y="240" font-size="18" fill="#92c5ff" font-weight="400">Choose your drive   →   Prepare packages   →   Eject and install</text>
<text x="32" y="282" font-size="14" fill="#a5b2c5" font-weight="400">Available space</text>
<text x="32" y="312" font-size="18" fill="#ebeef4" font-weight="400">12.4 GB</text>
<text x="352" y="282" font-size="14" fill="#a5b2c5" font-weight="400">Package Manager</text>
<text x="352" y="312" font-size="18" fill="#ebeef4" font-weight="400">1.0.0</text>
