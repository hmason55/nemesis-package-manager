<text x="560" y="506" font-size="14" fill="#a5b2c5" font-weight="400">Type</text>
<text x="694" y="506" font-size="14" fill="#a5b2c5" font-weight="400">Status</text>
<text x="48" y="546" font-size="21" fill="#ebeef4" font-weight="700">Example Player</text>
