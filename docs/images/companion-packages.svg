<text x="883.0" y="600" font-size="15" fill="#ebeef4" font-weight="400" text-anchor="middle">Remove</text>
<text x="32" y="646" font-size="15" fill="#a5b2c5" font-weight="400">Cloud registry continues below the USB workspace.</text>
<rect x="0" y="660" width="1024" height="40" rx="0" fill="#14181e"/>
<text x="24" y="686" font-size="14" fill="#a5b2c5" font-weight="400">Illustrative guide • Fictional packages and versions • Not a vehicle screenshot</text>
</g></svg>
