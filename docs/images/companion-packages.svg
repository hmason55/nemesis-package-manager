<text x="440" y="546" font-size="20" fill="#ebeef4" font-weight="400">1.5</text>
<text x="560" y="546" font-size="17" fill="#ebeef4" font-weight="400">Installer</text>
<text x="694" y="546" font-size="17" fill="#ebeef4" font-weight="400">Ready</text>
