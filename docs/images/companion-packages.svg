<text x="32" y="350" font-size="16" fill="#a5b2c5" font-weight="400">Drive checked. Ready to add or update packages.</text>
<text x="32" y="392" font-size="18" fill="#92c5ff" font-weight="400">Packages  1</text>
<text x="210" y="392" font-size="18" fill="#a5b2c5" font-weight="400">Add / update</text>
<text x="388" y="392" font-size="18" fill="#a5b2c5" font-weight="400">Drive setup</text>
<text x="32" y="438" font-size="21" fill="#ebeef4" font-weight="700">Packages on USB</text>
