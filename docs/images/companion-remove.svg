<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="612" viewBox="0 0 1024 612" role="img" aria-labelledby="title desc">
  <title id="title">Remove a package from USB</title>
  <desc id="desc">A USB-only removal confirmation. Delete data is unchecked by default.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="1024" height="612" fill="#14181e" />
    <text x="20" y="595" font-size="14" fill="#a5b2c5">Illustrative mockup - Example data - Not a vehicle screenshot</text>
    <rect x="152" y="120" width="720" height="352" rx="6" fill="#1b2430" stroke="#5b748f" />
    <text x="184" y="165" font-size="24" fill="#ebeef4" font-weight="700">Remove package from USB?</text>
    <text x="184" y="211" font-size="18" fill="#ebeef4" font-weight="400">Remove Example Player from E:\?</text>
    <rect x="184" y="247" width="22" height="22" rx="6" fill="#0d121a" stroke="#5b748f" />
    <text x="220" y="265" font-size="18" fill="#ebeef4" font-weight="400">Also delete this package's USB data</text>
    <text x="184" y="310" font-size="17" fill="#a5b2c5" font-weight="400">Leave unchecked to keep recordings and saved data.</text>
    <text x="184" y="340" font-size="17" fill="#a5b2c5" font-weight="400">This does not uninstall anything from the head unit.</text>
    <rect x="184" y="388" width="180" height="48" rx="6" fill="#202c3d" stroke="#5b748f" />
    <text x="274.0" y="418" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Cancel</text>
    <rect x="384" y="388" width="250" height="48" rx="6" fill="#49351a" stroke="#5b748f" />
    <text x="509.0" y="418" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Remove from USB</text>
  </g>
</svg>