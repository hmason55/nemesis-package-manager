<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="612" viewBox="0 0 1024 612" role="img" aria-labelledby="title desc">
<title id="title">Confirm a package update</title>
<desc id="desc">An update confirmation shows the installed and USB versions, Cancel and Update, and a reminder to keep USB connected.</desc>
<g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1024" height="612" rx="0" fill="#14181e" /><text x="20" y="43" font-size="26" fill="#ebeef4" font-weight="700" >Package Manager</text><g><rect x="656" y="14" width="112" height="48" rx="6" fill="#262d37" /><text x="712" y="44" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Refresh</text></g><g><rect x="780" y="14" width="92" height="48" rx="6" fill="#262d37" /><text x="826" y="44" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Help</text></g><g><rect x="892" y="14" width="112" height="48" rx="6" fill="#262d37" /><text x="948" y="44" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Close</text></g><g><rect x="20" y="76" width="240" height="48" rx="6" fill="#262d37" /><text x="140" y="106" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Installed (3)</text></g><g><rect x="268" y="76" width="240" height="48" rx="6" fill="#196389" /><text x="388" y="106" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Updates (1)</text></g><g><rect x="516" y="76" width="240" height="48" rx="6" fill="#262d37" /><text x="636" y="106" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Available (2)</text></g><g><rect x="764" y="76" width="240" height="48" rx="6" fill="#262d37" /><text x="884" y="106" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Scripts (1)</text></g><text x="36" y="153" font-size="16" fill="#a5b2c5" font-weight="400" >Name</text><text x="684" y="153" font-size="16" fill="#a5b2c5" font-weight="400" >Version</text><rect x="20" y="166" width="984" height="78" rx="0" fill="#2d415a" /><text x="36" y="197" font-size="22" fill="#ebeef4" font-weight="700" >Example Player</text><text x="36" y="225" font-size="16" fill="#a5b2c5" font-weight="400" >Update available</text><text x="684" y="213" font-size="19" fill="#ebeef4" font-weight="400" >1.4 → 1.5</text><g><rect x="20" y="500" width="300" height="48" rx="6" fill="#196389" /><text x="170" y="530" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Update</text></g><g><rect x="332" y="500" width="216" height="48" rx="6" fill="#262d37" /><text x="440" y="530" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Launch</text></g><g><rect x="560" y="500" width="216" height="48" rx="6" fill="#262d37" /><text x="668" y="530" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Uninstall</text></g><g><rect x="788" y="500" width="216" height="48" rx="6" fill="#262d37" /><text x="896" y="530" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Details</text></g><rect x="0" y="0" width="1024" height="568" rx="0" fill="#000" opacity="0.78"/><rect x="144" y="100" width="736" height="366" rx="0" fill="#14181e" /><text x="168" y="143" font-size="25" fill="#ebeef4" font-weight="700" >Update Example Player?</text><text x="168" y="184" font-size="19" fill="#ebeef4" font-weight="400" >Only install releases you trust that support your vehicle.</text><text x="168" y="212" font-size="19" fill="#ebeef4" font-weight="400" ></text><text x="168" y="240" font-size="19" fill="#ebeef4" font-weight="400" >Installed: 1.4</text><text x="168" y="268" font-size="19" fill="#ebeef4" font-weight="400" >On USB: 1.5</text><text x="168" y="296" font-size="19" fill="#ebeef4" font-weight="400" ></text><text x="168" y="324" font-size="19" fill="#ebeef4" font-weight="400" >Keep USB connected until it finishes.</text><g><rect x="168" y="394" width="332" height="48" rx="6" fill="#262d37" /><text x="334" y="424" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Cancel</text></g><g><rect x="512" y="394" width="344" height="48" rx="6" fill="#196389" /><text x="684" y="424" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Update</text></g>
<path d="M0 568H1024" stroke="#35404e"/><text x="20" y="595" font-size="14" fill="#a5b2c5" font-weight="400" >Illustrative mockup · Example packages and versions · Not a vehicle screenshot</text></g>
