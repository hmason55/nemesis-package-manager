<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="700" viewBox="0 0 1024 700" role="img" aria-labelledby="title desc"><title id="title">USB companion: registry preparation</title><desc id="desc">Illustrative companion browser with Settings, drive selector and preparation steps.</desc><g font-family="Arial, Helvetica, sans-serif">
