<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="t d"><title id="t">Prepare a USB drive from the registry</title><desc id="d">Illustrative controls, not a screenshot. Settings → Save registry address. Search packages and choose exact versions. Review advisory device requirements. Prepare selected versions. Read each result, then safely eject.</desc><rect width="720" height="490" rx="12" fill="#141a23"/><g font-family="system-ui,sans-serif" font-size="21"><text x="24" y="48" fill="#edf1f7">Prepare a USB drive from the registry</text><g transform="translate(24,85)"><rect width="672" height="56" rx="8" fill="#202c3d" stroke="#53677f"/><text x="20" y="36" fill="#edf1f7">Settings → Save registry address</text></g><g transform="translate(24,159)"><rect width="672" height="56" rx="8" fill="#202c3d" stroke="#53677f"/><text x="20" y="36" fill="#edf1f7">Search packages and choose exact versions</text></g><g transform="translate(24,233)"><rect width="672" height="56" rx="8" fill="#202c3d" stroke="#53677f"/><text x="20" y="36" fill="#edf1f7">Review advisory device requirements</text></g><g transform="translate(24,307)"><rect width="672" height="56" rx="8" fill="#202c3d" stroke="#53677f"/><text x="20" y="36" fill="#edf1f7">Prepare selected versions</text></g><g transform="translate(24,381)"><rect width="672" height="56" rx="8" fill="#202c3d" stroke="#53677f"/><text x="20" y="36" fill="#edf1f7">Read each result, then safely eject</text></g></g></svg>