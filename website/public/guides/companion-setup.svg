<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="612" viewBox="0 0 1024 612" role="img" aria-labelledby="title desc">
  <title id="title">USB companion: Drive setup</title>
  <desc id="desc">The USB manager version, a newer prerelease link, and an automatic-launch checkbox.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="1024" height="612" fill="#14181e" />
    <text x="20" y="595" font-size="14" fill="#a5b2c5">Illustrative mockup - Example data - Not a vehicle screenshot</text>
    <text x="32" y="48" font-size="26" fill="#ebeef4" font-weight="700">USB companion</text>
    <text x="32" y="92" font-size="22" fill="#ebeef4" font-weight="700">Drive setup</text>
    <rect x="32" y="115" width="960" height="410" rx="6" fill="#121821" stroke="#5b748f" />
    <text x="56" y="155" font-size="22" fill="#ebeef4" font-weight="700">Package Manager</text>
    <text x="56" y="191" font-size="20" fill="#ebeef4" font-weight="400">On USB: 0.2.0-build.64</text>
    <text x="56" y="229" font-size="18" fill="#a8d5ff" font-weight="400">Update available: 0.2.0-build.65 (prerelease)</text>
    <text x="56" y="265" font-size="18" fill="#92c5ff" font-weight="400">Get the newer manager release</text>
    <rect x="56" y="288" width="200" height="48" rx="6" fill="#202c3d" stroke="#5b748f" />
    <text x="156.0" y="318" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Check for updates</text>
    <text x="56" y="375" font-size="18" fill="#ebeef4" font-weight="700">Manager release bundle</text>
    <rect x="56" y="390" width="500" height="48" rx="6" fill="#262d37" stroke="#5b748f" />
    <text x="72" y="420" font-size="18" fill="#ebeef4" font-weight="400">Choose usb-package-manager-ready.zip</text>
    <rect x="590" y="390" width="240" height="48" rx="6" fill="#196389" stroke="#5b748f" />
    <text x="710.0" y="420" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Update manager</text>
    <rect x="56" y="466" width="22" height="22" rx="6" fill="#92c5ff" stroke="#5b748f" />
    <text x="62" y="484" font-size="18" fill="#081624" font-weight="700">x</text>
    <text x="92" y="484" font-size="18" fill="#ebeef4" font-weight="400">Run Package Manager when this USB is inserted</text>
    <text x="56" y="513" font-size="15" fill="#a5b2c5" font-weight="400">NEMESIS may still ask you to approve execution.</text>
  </g>
</svg>