<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="700" viewBox="0 0 1024 700" role="img" aria-labelledby="title desc"><title id="title">USB companion: remove package</title><desc id="desc">Illustrative companion browser with Settings, drive selector and preparation steps.</desc><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1024" height="700" rx="6" fill="#14181e"/>
<text x="32" y="46" font-size="26" fill="#ebeef4" font-weight="700">USB companion</text>
<rect x="714" y="18" width="132" height="48" rx="6" fill="#262d37" stroke="#5b748f"/>
<text x="780.0" y="48" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Settings</text>
<text x="866" y="48" font-size="17" fill="#92c5ff" font-weight="400">Guides</text>
<text x="946" y="48" font-size="14" fill="#a5b2c5" font-weight="400">● Local</text>
<text x="32" y="78" font-size="15" fill="#a5b2c5" font-weight="400">Prepare packages. Keep your USB data.</text>
<rect x="130" y="148" width="764" height="380" rx="6" fill="#14181e" stroke="#5b748f"/>
<text x="156" y="196" font-size="26" fill="#ebeef4" font-weight="700">Remove package from USB?</text>
<text x="156" y="250" font-size="20" fill="#ebeef4" font-weight="400">Example Player: packages/Example-Player/</text>
<text x="156" y="304" font-size="20" fill="#ebeef4" font-weight="400">□ Also delete this package’s USB data</text>
<text x="156" y="346" font-size="18" fill="#a5b2c5" font-weight="400">Unchecked: keep data in its original folder.</text>
<text x="156" y="382" font-size="18" fill="#a5b2c5" font-weight="400">The installed vehicle package stays unchanged.</text>
<rect x="156" y="446" width="332" height="48" rx="6" fill="#262d37" stroke="#5b748f"/>
<text x="322.0" y="476" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Cancel</text>
<rect x="500" y="446" width="368" height="48" rx="6" fill="#703a31" stroke="#5b748f"/>
<text x="684.0" y="476" font-size="18" fill="#ebeef4" font-weight="400" text-anchor="middle">Remove from USB</text>
<rect x="0" y="660" width="1024" height="40" rx="0" fill="#14181e"/>
<text x="24" y="686" font-size="14" fill="#a5b2c5" font-weight="400">Illustrative guide • Fictional packages and versions • Not a vehicle screenshot</text>
</g></svg>
