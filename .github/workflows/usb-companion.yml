name: USB companion

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test USB operations and local HTTP API
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install executable build dependency
        run: python -m pip install -r packaging/requirements-companion.txt
      - name: Build standalone companion
        run: python -m PyInstaller --clean --noconfirm packaging/usb-companion.spec
      - name: Smoke test executable entry point
        if: runner.os == 'Windows'
        run: python tests/smoke_companion_executable.py dist/nemesis-usb-companion.exe
      - name: Package Windows executable
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/nemesis-usb-companion.exe,LICENSE,docs/USB-COMPANION.md -DestinationPath dist/nemesis-usb-companion-windows-x86_64.zip
      - name: Smoke test and package Linux executable
        if: runner.os == 'Linux'
        run: |
          python tests/smoke_companion_executable.py dist/nemesis-usb-companion
          tar -czf dist/nemesis-usb-companion-linux-x86_64.tar.gz -C dist nemesis-usb-companion -C .. LICENSE docs/USB-COMPANION.md
      - uses: actions/upload-artifact@v6
        with:
          name: nemesis-usb-companion-${{ runner.os }}
          if-no-files-found: error
          path: dist/nemesis-usb-companion-*
