name: Python quality
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check tools tests/test_*.py
      - run: python -m coverage run --branch --source=tools -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m coverage json -o coverage.json
      - name: Enforce Python quality targets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from radon.metrics import mi_visit
          totals = json.loads(Path('coverage.json').read_text())['totals']
          for label, covered, total in (
              ('Line', totals['covered_lines'], totals['num_statements']),
              ('Branch', totals['covered_branches'], totals['num_branches']),
          ):
              if total == 0:
                  raise SystemExit(f'{label} coverage has no measured production code')
              ratio = covered / total
              print(f'{label} coverage: {ratio:.2%}')
              if ratio < 0.85:
                  raise SystemExit(f'{label} coverage is below 85%')
          for path in sorted(Path('tools').glob('*.py')):
              score = mi_visit(path.read_text(encoding='utf-8'), multi=True)
              print(f'{path}: MI {score:.2f}')
              if score <= 60:
                  raise SystemExit(f'{path} maintainability index must exceed 60')
          PY
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.json
          if-no-files-found: ignore
