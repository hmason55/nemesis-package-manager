name: Cloud registry checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node --test tools/companion_search.test.cjs
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v6
        with:
          name: registry-website
          path: website/dist
